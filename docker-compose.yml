services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - erp_network
    mem_limit: 64m

  database:
    image: mysql:8.0
    restart: unless-stopped
    # Memory-tuned MySQL flags to prevent OOM crashes on small Droplets
    command: >
      --innodb-buffer-pool-size=64M
      --key-buffer-size=16M
      --max-connections=50
      --tmp-table-size=16M
      --max-heap-table-size=16M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - erp_network
    mem_limit: 256m

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - database
    networks:
      - erp_network
    mem_limit: 128m

  inventory-service:
    build: ./inventory-service
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - database
    networks:
      - erp_network
    mem_limit: 128m

  order-service:
    build: ./order-service
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - database
    networks:
      - erp_network
    mem_limit: 128m

  reporting-service:
    build: ./reporting-service
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - database
    networks:
      - erp_network
    mem_limit: 128m

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - auth-service
      - inventory-service
      - order-service
    networks:
      - erp_network
    mem_limit: 128m

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
    depends_on:
      - api-gateway
    networks:
      - erp_network
    mem_limit: 128m

networks:
  erp_network:
    driver: bridge

volumes:
  db_data:
